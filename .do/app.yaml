name: atestat-instagram
region: nyc
databases:
  - engine: MYSQL
    name: db
    num_nodes: 1
    size: db-s-dev-database
    version: "8"

services:
  - name: web
    github:
      repo: andrei492/atestat
      branch: master
      deploy_on_push: true
    build_command: |
      composer install --no-dev --optimize-autoloader
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
      npm install
      npm run build
    run_command: |
      php artisan migrate --force
      php artisan storage:link
      heroku-php-apache2 public/
    envs:
      - key: APP_NAME
        value: "Atestat Instagram"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        type: SECRET
        value: "${APP_KEY}"
      - key: APP_URL
        value: "${APP_URL}"
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: "${db.HOSTNAME}"
      - key: DB_PORT
        value: "${db.PORT}"
      - key: DB_DATABASE
        value: "${db.DATABASE}"
      - key: DB_USERNAME
        value: "${db.USERNAME}"
      - key: DB_PASSWORD
        value: "${db.PASSWORD}"
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: FILESYSTEM_DISK
        value: local
