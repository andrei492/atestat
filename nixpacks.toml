# Explicitly set providers to only PHP (skip Node.js auto-detection)
providers = ["php"]

[phases.setup]
nixPkgs = ["php82"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader"]

[start]
cmd = "php artisan migrate --force 2>&1 || true && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
