[phases.setup]
nixPkgs = ["php82", "nodejs_18"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader", "npm ci || npm install"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "php artisan migrate --force 2>&1 || true && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
